name: THESEUS T09.3 - Native Input Serialization Validation

on:
  push:
    branches:
      - theseus/t09-3-native-input-serialization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build portable T09.3 native candidate
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ephemeral build toolchain
        shell: powershell
        run: |
          choco install llvm cmake ninja -y --no-progress

      - name: Apply preserved ReXGlue patches plus T09.3 input fix
        shell: cmd
        run: |
          python tools\apply_win_startup_fix.py

      - name: Audit Theseus boundary
        shell: cmd
        run: |
          python tools\theseus_audit.py --out out/theseus/THESEUS_STATUS.txt
          if errorlevel 1 exit /b %errorlevel%

      - name: Prove native non-ASan candidate
        shell: powershell
        run: |
          $cmake = Get-Content "CMakeLists.txt" -Raw
          if ($cmake -match "ASURA_ENABLE_ASAN|fsanitize=address|theseus_heap_probe") {
            throw "T09.3 must remain free of T09.2 ASan/heap-probe build hooks."
          }
          if (Test-Path "src/platform/theseus_heap_probe.cpp") {
            throw "T09.3 unexpectedly contains the T09.2 heap probe source."
          }
          $patch = Get-Content "tools/apply_win_startup_fix.py" -Raw
          foreach ($marker in @(
            "T09.3 InputSystem state mutex",
            "T09.3 serialize GetCapabilities",
            "T09.3 serialize GetState",
            "T09.3 serialize SetState",
            "T09.3 serialize GetKeystroke"
          )) {
            if ($patch -notmatch [regex]::Escape($marker)) {
              throw "Missing T09.3 input serialization marker: $marker"
            }
          }

      - name: Show tool versions
        shell: cmd
        run: |
          git --version
          cmake --version
          clang --version
          ninja --version

      - name: Build T09.3 native release
        shell: cmd
        run: |
          cmake --preset win-amd64-release -DASURA_SKIP_CODEGEN=ON -DREXGLUE_USE_VULKAN=ON -DREXGLUE_USE_D3D12=ON
          if errorlevel 1 exit /b %errorlevel%
          cmake --build out/build/win-amd64-release --target asura_wrath_recomp --parallel
          if errorlevel 1 exit /b %errorlevel%

      - name: Audit built PE
        shell: cmd
        run: |
          python tools\theseus_pe_audit.py "out/build/win-amd64-release/Asura's Wrath.exe" --out out/theseus/THESEUS_PE_STATUS.txt
          if errorlevel 1 exit /b %errorlevel%

      - name: Crash diagnostics self-test
        shell: powershell
        run: |
          $build = Resolve-Path "out/build/win-amd64-release"
          $exe = Join-Path $build "Asura's Wrath.exe"
          $userData = Join-Path $build "UserData"
          if (Test-Path $userData) { Remove-Item -Recurse -Force $userData }

          $process = Start-Process -FilePath $exe -ArgumentList "--theseus_crash_test","--no_launcher" -PassThru -Wait
          Write-Host "Intentional crash exit code: $($process.ExitCode)"

          $crashDir = Join-Path $userData "Logs/Crashes"
          $session = Join-Path $userData "Logs/StabilitySession.txt"
          $reports = @(Get-ChildItem $crashDir -Filter "TheseusCrash_*.txt" -ErrorAction SilentlyContinue)
          $dumps = @(Get-ChildItem $crashDir -Filter "TheseusCrash_*.dmp" -ErrorAction SilentlyContinue)

          if ($reports.Count -lt 1) { throw "T09.3 self-test did not create a crash text report." }
          if ($dumps.Count -lt 1) { throw "T09.3 self-test did not create a minidump." }
          if ($dumps[0].Length -lt 4096) { throw "T09.3 minidump is unexpectedly small." }
          if (!(Test-Path $session)) { throw "T09.3 stability breadcrumb log was not created." }

          Remove-Item -Recurse -Force $userData

      - name: Hard-exit guard self-test
        shell: powershell
        run: |
          $build = Resolve-Path "out/build/win-amd64-release"
          $exe = Join-Path $build "Asura's Wrath.exe"
          $userData = Join-Path $build "UserData"
          if (Test-Path $userData) { Remove-Item -Recurse -Force $userData }

          $process = Start-Process -FilePath $exe -ArgumentList "--theseus_hard_exit_test","--no_launcher" -PassThru -Wait
          Write-Host "Guard parent exit code: $($process.ExitCode)"

          $crashDir = Join-Path $userData "Logs/Crashes"
          $hardReports = @(Get-ChildItem $crashDir -Filter "TheseusHardExit_*.txt" -ErrorAction SilentlyContinue)
          if ($hardReports.Count -lt 1) { throw "T09.3 guard did not create a hard-exit report." }

          $hardText = Get-Content $hardReports[0].FullName -Raw
          if ($hardText -notmatch "THESEUS_HARD_EXIT_SELF_TEST") {
            throw "T09.3 hard-exit report did not preserve the self-test classification."
          }

          Remove-Item -Recurse -Force $userData

      - name: Package portable T09.3 native candidate
        shell: powershell
        run: |
          $build = Resolve-Path "out/build/win-amd64-release"
          $dist = "out/dist/ASURAS_WRATH_THESEUS_T09_3_NATIVE"
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item (Join-Path $build "Asura's Wrath.exe") $dist
          Get-ChildItem $build -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dist
          Get-ChildItem "tools/rexglue/out/win-amd64" -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dist

          Copy-Item "out/theseus/THESEUS_STATUS.txt" "$dist/THESEUS_STATUS.txt"
          Copy-Item "out/theseus/THESEUS_PE_STATUS.txt" "$dist/THESEUS_PE_STATUS.txt"
          Copy-Item "docs/THESEUS_ARCHITECTURE.md" "$dist/THESEUS_ARCHITECTURE.md"

          $readme = @(
            "ASURA'S WRATH - THESEUS T09.3 NATIVE INPUT SERIALIZATION",
            "======================================================",
            "",
            "Final T09 native validation candidate.",
            "",
            "Base: validated T09.1 hard-exit guard.",
            "Carried fix: serialized InputSystem state access discovered during T09.2 diagnostics.",
            "",
            "No AddressSanitizer, heap probe, llvm-symbolizer, or diagnostic runtime is included.",
            "",
            "Place this folder next to your existing Data folder and launch Asura's Wrath.exe normally.",
            "Recommended validation: D3D12, 1280x720 fullscreen, VSync ON, Async Shaders ON.",
            "Exercise menu, gameplay, Alt-Tab/focus changes, then close normally.",
            "",
            "Preserve UserData\Logs if any unexpected exit occurs."
          )
          Set-Content -Encoding UTF8 -Path "$dist\THESEUS_README.txt" -Value $readme

          $zip = "out/dist/ASURAS_WRATH_THESEUS_T09_3_NATIVE_INPUT_FIX_PORTABLE.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path "$dist\*" -DestinationPath $zip -Force

      - name: Verify package
        shell: powershell
        run: |
          Get-Content "out/theseus/THESEUS_STATUS.txt"
          Get-Content "out/theseus/THESEUS_PE_STATUS.txt"

          $dist = "out/dist/ASURAS_WRATH_THESEUS_T09_3_NATIVE"
          $forbidden = @(Get-ChildItem $dist -Recurse -File | Where-Object {
            $_.Name -match "asan|llvm-symbolizer|heap_probe"
          })
          if ($forbidden.Count -gt 0) {
            throw "T09.3 package contains forbidden diagnostic files: $($forbidden.Name -join ', ')"
          }

          $exe = Get-Item "$dist\Asura's Wrath.exe"
          Write-Host "Native EXE size: $($exe.Length) bytes"

          $zip = Get-Item "out/dist/ASURAS_WRATH_THESEUS_T09_3_NATIVE_INPUT_FIX_PORTABLE.zip"
          Write-Host "Portable package: $($zip.FullName)"
          Write-Host "Size: $($zip.Length) bytes"

      - name: Upload portable T09.3 native candidate
        uses: actions/upload-artifact@v4
        with:
          name: ASURAS_WRATH_THESEUS_T09_3_NATIVE_INPUT_FIX_PORTABLE
          path: out/dist/ASURAS_WRATH_THESEUS_T09_3_NATIVE_INPUT_FIX_PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
