name: ASURA Static Gate

on:
  workflow_dispatch:
  push:
    branches: [tu01-native-build]
    paths:
      - ".github/workflows/ASURA_STATIC_GATE.yml"
      - "CMakeLists.txt"
      - "includes/**"
      - "src/**"
      - "tools/asura_native_audit.py"
      - "tu01/**"

permissions:
  contents: read

concurrency:
  group: asura-static-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: TU01 generated integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruct verified TU01 generated checkpoint
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/ASURA_TU01_GENERATED.zip"
          cat             tu01/ASURA_TU01_GENERATED.zip.part01             tu01/ASURA_TU01_GENERATED.zip.part02             > "$payload"

          expected="29c9213ee11318b119dee60335b1dfe81f3dee740063c754b7967ac8c311b91a"
          actual="$(sha256sum "$payload" | awk '{print $1}')"
          echo "TU01 generated checkpoint SHA-256: $actual"
          test "$actual" = "$expected"

          stage="$RUNNER_TEMP/asura-tu01-generated"
          rm -rf "$stage" generated/default
          mkdir -p "$stage"

          # The frozen archive was produced on Windows and stores backslashes
          # in ZIP member names. Normalize separators explicitly so Linux
          # runners reconstruct the same directory tree without changing bytes.
          python3 - "$payload" "$stage" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  rel = pathlib.PurePosixPath(info.filename.replace("\\", "/"))
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"unsafe ZIP member: {info.filename!r}")
                  target = root.joinpath(*rel.parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, target.open("wb") as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
          PY

          test -d "$stage/generated/default"
          mkdir -p generated
          cp -a "$stage/generated/default" generated/default

          count="$(find generated/default -maxdepth 1 -name 'asura_wrath_recomp.*.cpp' | wc -l)"
          echo "Generated partitions: $count"
          test "$count" -eq 207

      - name: Run static native audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/asura_native_audit.py             --report out/audit/asura_native_audit.json

      - name: Summarize high-value findings
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path

          p = Path("out/audit/asura_native_audit.json")
          if not p.exists():
              print("Audit report was not produced.")
              raise SystemExit(0)

          data = json.loads(p.read_text(encoding="utf-8"))
          print("Result:", data.get("result"))
          print("Trap surface:", data.get("metadata", {}).get("trap_surface_counts", {}))

          candidates = data.get("indirect_candidates", {})
          for bucket in ("PROVEN", "HIGH_CONFIDENCE", "REVIEW", "REJECT"):
              rows = candidates.get(bucket, [])
              print(f"{bucket}: {len(rows)}")
              for row in rows:
                  if row.get("address") == "0x829C9BD0":
                      print("  0x829C9BD0:", json.dumps(row, indent=2))

          # Show the emitted owner body around the historical 0x829C9BD0
          # target. This is source generated from the frozen checkpoint only;
          # no copyrighted XEX bytes are stored or uploaded.
          owner_marker = "DEFINE_REX_FUNC(sub_829C9BC0)"
          for cpp in sorted(Path("generated/default").glob("asura_wrath_recomp.*.cpp")):
              text = cpp.read_text(encoding="utf-8", errors="replace")
              pos = text.find(owner_marker)
              if pos < 0:
                  continue
              end = text.find("DEFINE_REX_FUNC(", pos + len(owner_marker))
              if end < 0:
                  end = min(len(text), pos + 12000)
              body = text[pos:end]
              lines = body.splitlines()
              print(f"OWNER_SOURCE_FILE: {cpp.name}")
              print("OWNER_SOURCE_BEGIN")
              for line in lines[:220]:
                  print(line)
              print("OWNER_SOURCE_END")
              break

      - name: Upload static audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASURA_STATIC_AUDIT_REPORT
          path: out/audit/asura_native_audit.json
          if-no-files-found: warn
          retention-days: 30
