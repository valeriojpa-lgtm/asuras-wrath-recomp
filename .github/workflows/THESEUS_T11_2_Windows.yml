name: THESEUS T11.2 - Native Render Resolution

on:
  push:
    branches:
      - theseus/t11-2-native-render-resolution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build portable T11.2 render-resolution candidate
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ephemeral build toolchain
        shell: powershell
        run: |
          choco install llvm cmake ninja -y --no-progress

      - name: Apply preserved ReXGlue patches plus T09.3 stability fix
        shell: cmd
        run: |
          python tools\apply_win_startup_fix.py

      - name: Apply Asura postprocess scaling diagnostic
        shell: cmd
        run: |
          python tools\apply_asura_resolution_postprocess_fix.py --report-only
          if errorlevel 1 exit /b %errorlevel%
          python tools\apply_asura_resolution_postprocess_fix.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Prove Asura postprocess scaling diagnostic
        shell: powershell
        run: |
          $hits = Get-ChildItem "generated/default/asura_wrath_recomp.*.cpp" |
            Select-String -Pattern "THESEUS T11.2 diagnostic @"
          if ($hits.Count -ne 5) {
            throw "Expected 5 Asura postprocess diagnostic replacements, found $($hits.Count)."
          }
          $hits | ForEach-Object { Write-Host $_.Line }

      - name: Audit Theseus boundary
        shell: cmd
        run: |
          python tools\theseus_audit.py --out out/theseus/THESEUS_STATUS.txt
          if errorlevel 1 exit /b %errorlevel%

      - name: Prove T11.2 true renderer scaling
        shell: powershell
        run: |
          $status = Get-Content "out/theseus/THESEUS_STATUS.txt" -Raw
          $header = Get-Content "src/platform/theseus_render_resolution.h" -Raw
          $source = Get-Content "src/platform/theseus_render_resolution.cpp" -Raw
          $launcher = Get-Content "src/asura_launcher_win.cpp" -Raw
          $config = Get-Content "src/platform/theseus_config.cpp" -Raw
          $rexScale = Get-Content "tools/rexglue/src/graphics/pipeline/texture/cache.cpp" -Raw

          if ($status -notmatch "Milestone: T11.2-native-render-resolution") {
            throw "T11.2 audit did not publish the expected milestone."
          }
          if ($status -notmatch "Native render-resolution policy: PASS") {
            throw "T11.2 audit did not validate renderer scaling."
          }
          foreach ($needle in @("kOriginal720p","k1440p","k4K")) {
            if ($header -notmatch $needle) {
              throw "T11.2 true render preset missing: $needle"
            }
          }
          if ($launcher -notmatch 'add_int\("resolution_scale", render_resolution\.scale\)' -or
              $launcher -notmatch '"--resolution_scale="') {
            throw "T11.2 launcher does not bridge the true renderer resolution scale."
          }
          if ($launcher -match '"--video_mode_width="' -or
              $launcher -match '"--video_mode_height="') {
            throw "T11.2 still treats advertised Xbox video mode as internal render resolution."
          }
          foreach ($label in @("Original (720p)","1440p","4K","Automática","Principal")) {
            if ($launcher -notmatch [regex]::Escape($label)) {
              throw "T11.2 launcher label missing: $label"
            }
          }
          if ($launcher -match 'L"1080p"' -or $launcher -match 'L"Nativa"') {
            throw "T11.2 exposes a fractional/non-real render preset."
          }
          if ($config -notmatch "RenderScalePreset=") {
            throw "T11.2 true scale preset is not persisted."
          }
          if ($rexScale -notmatch "REXCVAR_DEFINE_INT32\(resolution_scale, 1" -or
              $rexScale -notmatch "GetConfigDrawResolutionScale") {
            throw "Pinned ReXGlue does not expose the expected true render scaling path."
          }

      - name: Test T11.2 true renderer presets
        shell: powershell
        run: |
          @'
          #include <cassert>
          #include "platform/theseus_render_resolution.h"
          int main() {
            using namespace theseus;
            auto original = ResolveRenderResolution(RenderResolutionPreset::kOriginal720p);
            assert(original.scale == 1);
            assert(original.reference_width == 1280 && original.reference_height == 720);
            auto r1440 = ResolveRenderResolution(RenderResolutionPreset::k1440p);
            assert(r1440.scale == 2);
            assert(r1440.reference_width == 2560 && r1440.reference_height == 1440);
            auto r4k = ResolveRenderResolution(RenderResolutionPreset::k4K);
            assert(r4k.scale == 3);
            assert(r4k.reference_width == 3840 && r4k.reference_height == 2160);
            return 0;
          }
          '@ | Set-Content -Encoding UTF8 out/render_resolution_test.cpp
          clang++ -std=c++23 -Isrc out/render_resolution_test.cpp src/platform/theseus_render_resolution.cpp -o out/render_resolution_test.exe
          if ($LASTEXITCODE -ne 0) { throw "T11.2 renderer-scale test failed to compile." }
          & out/render_resolution_test.exe
          if ($LASTEXITCODE -ne 0) { throw "T11.2 renderer-scale assertions failed." }

      - name: Show tool versions
        shell: cmd
        run: |
          git --version
          cmake --version
          clang --version
          ninja --version

      - name: Build T11.2 native release
        shell: cmd
        run: |
          cmake --preset win-amd64-release -DASURA_SKIP_CODEGEN=ON -DREXGLUE_USE_VULKAN=ON -DREXGLUE_USE_D3D12=ON
          if errorlevel 1 exit /b %errorlevel%
          cmake --build out/build/win-amd64-release --target asura_wrath_recomp --parallel
          if errorlevel 1 exit /b %errorlevel%

      - name: Audit built PE
        shell: cmd
        run: |
          python tools\theseus_pe_audit.py "out/build/win-amd64-release/Asura's Wrath.exe" --out out/theseus/THESEUS_PE_STATUS.txt
          if errorlevel 1 exit /b %errorlevel%

      - name: Crash diagnostics self-test
        shell: powershell
        run: |
          $build = Resolve-Path "out/build/win-amd64-release"
          $exe = Join-Path $build "Asura's Wrath.exe"
          $userData = Join-Path $build "UserData"
          if (Test-Path $userData) { Remove-Item -Recurse -Force $userData }

          $process = Start-Process -FilePath $exe -ArgumentList "--theseus_crash_test","--no_launcher" -PassThru -Wait
          Write-Host "Intentional crash exit code: $($process.ExitCode)"

          $crashDir = Join-Path $userData "Logs/Crashes"
          $session = Join-Path $userData "Logs/StabilitySession.txt"
          $reports = @(Get-ChildItem $crashDir -Filter "TheseusCrash_*.txt" -ErrorAction SilentlyContinue)
          $dumps = @(Get-ChildItem $crashDir -Filter "TheseusCrash_*.dmp" -ErrorAction SilentlyContinue)

          if ($reports.Count -lt 1) { throw "T11 self-test did not create a crash text report." }
          if ($dumps.Count -lt 1) { throw "T11 self-test did not create a minidump." }
          if ($dumps[0].Length -lt 4096) { throw "T10 minidump is unexpectedly small." }
          if (!(Test-Path $session)) { throw "T11 stability breadcrumb log was not created." }

          Remove-Item -Recurse -Force $userData

      - name: Hard-exit guard self-test
        shell: powershell
        run: |
          $build = Resolve-Path "out/build/win-amd64-release"
          $exe = Join-Path $build "Asura's Wrath.exe"
          $userData = Join-Path $build "UserData"
          if (Test-Path $userData) { Remove-Item -Recurse -Force $userData }

          $process = Start-Process -FilePath $exe -ArgumentList "--theseus_hard_exit_test","--no_launcher" -PassThru -Wait
          Write-Host "Guard parent exit code: $($process.ExitCode)"

          $crashDir = Join-Path $userData "Logs/Crashes"
          $hardReports = @(Get-ChildItem $crashDir -Filter "TheseusHardExit_*.txt" -ErrorAction SilentlyContinue)
          if ($hardReports.Count -lt 1) { throw "T11 guard did not create a hard-exit report." }

          $hardText = Get-Content $hardReports[0].FullName -Raw
          if ($hardText -notmatch "THESEUS_HARD_EXIT_SELF_TEST") {
            throw "T10 hard-exit report did not preserve the self-test classification."
          }
          if ($hardText -notmatch "Milestone: T11.2-native-render-resolution") {
            throw "T11.2 hard-exit report still carries a stale milestone label."
          }

          Remove-Item -Recurse -Force $userData

      - name: Package portable T11.2 render resolution
        shell: powershell
        run: |
          $build = Resolve-Path "out/build/win-amd64-release"
          $dist = "out/dist/ASURAS_WRATH_THESEUS_T11_2_RENDER_RESOLUTION"
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item (Join-Path $build "Asura's Wrath.exe") $dist
          Get-ChildItem $build -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dist
          Get-ChildItem "tools/rexglue/out/win-amd64" -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dist

          Copy-Item "out/theseus/THESEUS_STATUS.txt" "$dist/THESEUS_STATUS.txt"
          Copy-Item "out/theseus/THESEUS_PE_STATUS.txt" "$dist/THESEUS_PE_STATUS.txt"
          Copy-Item "docs/THESEUS_ARCHITECTURE.md" "$dist/THESEUS_ARCHITECTURE.md"

          $readme = @(
            "ASURA'S WRATH - THESEUS T11.2 NATIVE RENDER RESOLUTION",
            "======================================================",
            "",
            "T11.2 postprocess diagnostic candidate.",
            "",
            "Base: validated/frozen T11.1 native display modes.",
            "Theseus now separates physical output resolution from guest render resolution.",
            "True render presets: Original (720p) / 1440p / 4K.",
            "DIAGNOSTIC: exact Asura resolution-scaling postprocess bypass is compiled in.",
            "This build intentionally changes/disables postprocessing to confirm the green-corruption cause.",
            "Monitor labels are compact: Automática / Principal / Pantalla N.",
            "",
            "SDL Window/monitor application, D3D12/Vulkan Presenter, swapchain, Xenos command processor and shader translator remain compatibility-backed.",
            "",
            "Place this folder next to your existing Data folder and launch Asura's Wrath.exe normally.",
            "",
            "Validation:",
            "  1. Confirm monitor labels are concise.",
            "  2. Set internal rendering to 1440p.",
            "  3. Check whether the green/black corruption disappears at the title screen/gameplay.",
            "  4. Confirm menu + gameplay + controls + language + repeated Alt-Tab + clean exit.",
            "  5. Preserve the frozen T11.1 baseline.",
            "",
            "Preserve UserData\Logs if any unexpected exit occurs."
          )
          Set-Content -Encoding UTF8 -Path "$dist\THESEUS_README.txt" -Value $readme

          $zip = "out/dist/ASURAS_WRATH_THESEUS_T11_2_POSTFX_DIAG.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path "$dist\*" -DestinationPath $zip -Force

      - name: Verify package
        shell: powershell
        run: |
          Get-Content "out/theseus/THESEUS_STATUS.txt"
          Get-Content "out/theseus/THESEUS_PE_STATUS.txt"

          $dist = "out/dist/ASURAS_WRATH_THESEUS_T11_2_RENDER_RESOLUTION"
          $forbidden = @(Get-ChildItem $dist -Recurse -File | Where-Object {
            $_.Name -match "asan|llvm-symbolizer|heap_probe"
          })
          if ($forbidden.Count -gt 0) {
            throw "T11.2 package contains forbidden diagnostic files: $($forbidden.Name -join ', ')"
          }

          $zip = Get-Item "out/dist/ASURAS_WRATH_THESEUS_T11_2_POSTFX_DIAG.zip"
          Write-Host "Portable package: $($zip.FullName)"
          Write-Host "Size: $($zip.Length) bytes"

      - name: Upload portable T11.2 render resolution
        uses: actions/upload-artifact@v4
        with:
          name: ASURAS_WRATH_THESEUS_T11_2_POSTFX_DIAG
          path: out/dist/ASURAS_WRATH_THESEUS_T11_2_POSTFX_DIAG.zip
          if-no-files-found: error
          retention-days: 30
