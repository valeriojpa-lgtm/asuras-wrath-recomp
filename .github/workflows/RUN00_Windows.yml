name: RUN 04 - Native Launcher + Language + Icon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Asura's Wrath Recomp
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build toolchain
        shell: powershell
        run: |
          choco install llvm cmake ninja -y --no-progress

      - name: Apply ReXGlue startup and VFS patches
        shell: cmd
        run: |
          python tools\apply_win_startup_fix.py

      - name: Show tool versions
        shell: cmd
        run: |
          git --version
          cmake --version
          clang --version
          ninja --version

      - name: Build and package RUN 04
        shell: cmd
        run: |
          cmake --preset win-amd64-release -DASURA_SKIP_CODEGEN=ON -DREXGLUE_USE_VULKAN=ON -DREXGLUE_USE_D3D12=ON
          if errorlevel 1 exit /b %errorlevel%
          cmake --build out/build/win-amd64-release --target asura_wrath_recomp --parallel
          if errorlevel 1 exit /b %errorlevel%

          if not exist out\dist mkdir out\dist
          if exist out\dist\Asuras_Wrath_Windows_x86_64 rmdir /s /q out\dist\Asuras_Wrath_Windows_x86_64
          mkdir out\dist\Asuras_Wrath_Windows_x86_64

          copy /y "out\build\win-amd64-release\Asura's Wrath.exe" "out\dist\Asuras_Wrath_Windows_x86_64\" >nul
          if exist out\build\win-amd64-release\*.dll copy /y out\build\win-amd64-release\*.dll out\dist\Asuras_Wrath_Windows_x86_64\ >nul
          if exist tools\rexglue\out\win-amd64\*.dll copy /y tools\rexglue\out\win-amd64\*.dll out\dist\Asuras_Wrath_Windows_x86_64\ >nul

          powershell -NoProfile -Command "Compress-Archive -Path 'out\dist\Asuras_Wrath_Windows_x86_64\*' -DestinationPath 'out\dist\Asuras_Wrath_Windows_x86_64.zip' -Force"

      - name: Verify output
        shell: powershell
        run: |
          Write-Host "=== out/dist ==="
          Get-ChildItem -Recurse out\dist
          $zip = Get-ChildItem out\dist\*.zip | Select-Object -First 1
          if (-not $zip) {
            throw "RUN 04 package ZIP was not created."
          }
          Write-Host "Package: $($zip.FullName)"
          Write-Host "Size: $($zip.Length) bytes"

      - name: Upload RUN 04 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASURAS_WRATH_NATIVE_LAUNCHER
          path: out/dist/*.zip
          if-no-files-found: error
          retention-days: 30
