name: RUN 00 - Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Asura's Wrath Recomp
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build toolchain
        shell: powershell
        run: |
          choco install llvm cmake ninja -y --no-progress

      - name: Apply Windows startup patch
        shell: powershell
        run: |
          $path = "tools\rexglue\src\core\filesystem_win.cpp"
          $text = Get-Content $path -Raw
          $old = @'
std::filesystem::path GetExecutablePath() {
  wchar_t* path;
  auto error = _get_wpgmptr(&path);
  return !error ? std::filesystem::path(path) : std::filesystem::path();
}
'@
          $new = @'
std::filesystem::path GetExecutablePath() {
  std::wstring path(32768, L'\0');
  DWORD length = GetModuleFileNameW(nullptr, path.data(), static_cast<DWORD>(path.size()));
  if (length == 0 || length >= path.size()) {
    return std::filesystem::path();
  }
  path.resize(length);
  return std::filesystem::path(path);
}
'@
          if (-not $text.Contains($old)) {
            throw "Expected GetExecutablePath block not found."
          }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Show tool versions
        shell: cmd
        run: |
          git --version
          cmake --version
          clang --version
          ninja --version

      - name: Build and package RUN 00
        shell: cmd
        run: |
          cmake --preset win-amd64-release -DASURA_SKIP_CODEGEN=ON -DREXGLUE_USE_VULKAN=ON -DREXGLUE_USE_D3D12=ON
          if errorlevel 1 exit /b %errorlevel%
          cmake --build out/build/win-amd64-release --target asura_wrath_recomp --parallel
          if errorlevel 1 exit /b %errorlevel%

          if not exist out\dist mkdir out\dist
          if exist out\dist\asura_wrath_recomp_windows_x86_64 rmdir /s /q out\dist\asura_wrath_recomp_windows_x86_64
          mkdir out\dist\asura_wrath_recomp_windows_x86_64

          copy /y out\build\win-amd64-release\asura_wrath_recomp.exe out\dist\asura_wrath_recomp_windows_x86_64\ >nul
          if exist out\build\win-amd64-release\*.dll copy /y out\build\win-amd64-release\*.dll out\dist\asura_wrath_recomp_windows_x86_64\ >nul
          if exist tools\rexglue\out\win-amd64\*.dll copy /y tools\rexglue\out\win-amd64\*.dll out\dist\asura_wrath_recomp_windows_x86_64\ >nul

          powershell -NoProfile -Command "Compress-Archive -Path 'out\dist\asura_wrath_recomp_windows_x86_64\*' -DestinationPath 'out\dist\asura_wrath_recomp_windows_x86_64.zip' -Force"

      - name: Verify output
        shell: powershell
        run: |
          Write-Host "=== out/dist ==="
          Get-ChildItem -Recurse out\dist
          $zip = Get-ChildItem out\dist\*.zip | Select-Object -First 1
          if (-not $zip) {
            throw "RUN 00 package ZIP was not created."
          }
          Write-Host "Package: $($zip.FullName)"
          Write-Host "Size: $($zip.Length) bytes"

      - name: Upload RUN 00 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASURA_RECOMP_RUN00
          path: out/dist/*.zip
          if-no-files-found: error
          retention-days: 30
