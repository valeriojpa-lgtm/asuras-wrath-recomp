name: TU01 - Native Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Asura's Wrath Recomp
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout TU01 integration branch
        uses: actions/checkout@v4
        with:
          ref: tu01-native-build
          submodules: recursive
          fetch-depth: 0

      - name: Install build toolchain
        shell: powershell
        run: |
          choco install llvm cmake ninja -y --no-progress

      - name: Install verified TU01 generated source
        shell: powershell
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "ASURA_TU01_GENERATED.zip"
          $part1 = "tu01/ASURA_TU01_GENERATED.zip.part01"
          $part2 = "tu01/ASURA_TU01_GENERATED.zip.part02"
          $expected = "29c9213ee11318b119dee60335b1dfe81f3dee740063c754b7967ac8c311b91a"

          foreach ($part in @($part1, $part2)) {
            if (-not (Test-Path $part)) {
              throw "Missing TU01 payload part: $part"
            }
          }

          $out = [System.IO.File]::Create($payload)
          try {
            foreach ($part in @($part1, $part2)) {
              $bytes = [System.IO.File]::ReadAllBytes($part)
              $out.Write($bytes, 0, $bytes.Length)
            }
          }
          finally {
            $out.Dispose()
          }

          $actual = (Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "TU01 payload SHA-256: $actual"
          if ($actual -ne $expected) {
            throw "TU01 payload SHA-256 mismatch. Expected $expected, got $actual"
          }

          $stage = Join-Path $env:RUNNER_TEMP "asura-tu01"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Expand-Archive -LiteralPath $payload -DestinationPath $stage -Force

          $generated = Join-Path $stage "generated/default"
          if (-not (Test-Path $generated)) {
            throw "TU01 archive does not contain generated/default"
          }

          if (Test-Path "generated/default") {
            Remove-Item "generated/default" -Recurse -Force
          }
          Copy-Item $generated "generated/default" -Recurse -Force

          # ZIP archives preserve host timestamps. If any extracted generated
          # source is slightly ahead of the GitHub runner clock, Ninja can
          # repeatedly consider build.ninja dirty and abort after 100 retries.
          # Normalize generated-source mtimes before CMake/Ninja see them.
          $stamp = (Get-Date).ToUniversalTime().AddMinutes(-2)
          Get-ChildItem "generated/default" -Recurse -File | ForEach-Object {
            $_.LastWriteTimeUtc = $stamp
          }

          # TU01 runtime entrypoint compatibility.
          # Initial XThread enters at 0x82B75150, while codegen emitted xstart at 0x82B75160.
          # Patch only the transient extracted sources; the frozen TU01 ZIP remains untouched.
          $initPath = "generated/default/asura_wrath_init.cpp"
          $regPath = "generated/default/asura_wrath_register.cpp"
          $initText = Get-Content $initPath -Raw
          if ($initText -notmatch "0x82B75150") {
            $initText = $initText.Replace("{ 0x82B75160, xstart },", "{ 0x82B75150, xstart },`r`n`t{ 0x82B75160, xstart },")
            $initText = $initText.Replace("{ 0x82B54B68, sub_82B54B68 },", "{ 0x82B54B58, sub_82B54B68 },`r`n`t{ 0x82B54B68, sub_82B54B68 },")
            Set-Content -LiteralPath $initPath -Value $initText -Encoding UTF8
          }
          $regText = Get-Content $regPath -Raw
          if ($regText -notmatch "SetFunction\(0x82B75150") {
            $regText = $regText.Replace("registrar->SetFunction(0x82B75160, xstart);", "registrar->SetFunction(0x82B75150, xstart);`r`n  registrar->SetFunction(0x82B75160, xstart);")
            $regText = $regText.Replace("registrar->SetFunction(0x82B54B68, sub_82B54B68);", "registrar->SetFunction(0x82B54B58, sub_82B54B68);`r`n  registrar->SetFunction(0x82B54B68, sub_82B54B68);")
            Set-Content -LiteralPath $regPath -Value $regText -Encoding UTF8
          }
          Write-Host "TU01 entry aliases installed: 0x82B75150 -> xstart; 0x82B54B58 -> sub_82B54B68"

          $cppCount = (Get-ChildItem "generated/default/asura_wrath_recomp.*.cpp").Count
          if ($cppCount -ne 207) {
            throw "Unexpected TU01 partition count: $cppCount (expected 207)"
          }
          Write-Host "TU01 generated/default installed: $cppCount partitions"

      - name: Apply ReXGlue startup and VFS patches
        shell: cmd
        run: |
          python tools\apply_win_startup_fix.py

      - name: Show tool versions
        shell: cmd
        run: |
          git --version
          cmake --version
          clang --version
          ninja --version

      - name: Build and package TU01
        shell: cmd
        run: |
          if exist out\build\win-amd64-release rmdir /s /q out\build\win-amd64-release
          cmake --preset win-amd64-release -DASURA_SKIP_CODEGEN=ON -DREXGLUE_USE_VULKAN=ON -DREXGLUE_USE_D3D12=ON
          if errorlevel 1 exit /b %errorlevel%
          cmake --build out/build/win-amd64-release --target asura_wrath_recomp --parallel
          if errorlevel 1 exit /b %errorlevel%

          if not exist out\dist mkdir out\dist
          if exist out\dist\Asuras_Wrath_Windows_x86_64 rmdir /s /q out\dist\Asuras_Wrath_Windows_x86_64
          mkdir out\dist\Asuras_Wrath_Windows_x86_64

          copy /y "out\build\win-amd64-release\Asura's Wrath.exe" "out\dist\Asuras_Wrath_Windows_x86_64\" >nul
          if exist out\build\win-amd64-release\*.dll copy /y out\build\win-amd64-release\*.dll out\dist\Asuras_Wrath_Windows_x86_64\ >nul
          if exist tools\rexglue\out\win-amd64\*.dll copy /y tools\rexglue\out\win-amd64\*.dll out\dist\Asuras_Wrath_Windows_x86_64\ >nul

          powershell -NoProfile -Command "Compress-Archive -Path 'out\dist\Asuras_Wrath_Windows_x86_64\*' -DestinationPath 'out\dist\Asuras_Wrath_Windows_x86_64.zip' -Force"

      - name: Verify output
        shell: powershell
        run: |
          Write-Host "=== out/dist ==="
          Get-ChildItem -Recurse out\dist
          $zip = Get-ChildItem out\dist\*.zip | Select-Object -First 1
          if (-not $zip) {
            throw "TU01 package ZIP was not created."
          }
          Write-Host "Package: $($zip.FullName)"
          Write-Host "Size: $($zip.Length) bytes"

      - name: Upload TU01 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASURAS_WRATH_TU01_NATIVE
          path: out/dist/*.zip
          if-no-files-found: error
          retention-days: 30
